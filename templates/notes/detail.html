<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>{{ note.title }}</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>

<body class="container mt-5" style="max-width: 700px;">
    <h1>{{ note.title }}</h1>
    <p class="text-muted">Создано: {{ note.created_at }}</p>
    <hr>
    <p style="white-space: pre-wrap;">{{ note.text }}</p>
    <hr>
    <a href="{% url 'note_list' %}" class="btn btn-secondary">Назад к списку</a>
</body>

</html>
