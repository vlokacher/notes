<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Новая заметка</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>

<body class="container mt-5" style="max-width: 600px;">
    <h2>✍️ Создать новую заметку</h2>
    <form method="POST" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'note_list' %}" class="btn btn-secondary">Назад</a>
    </form>
</body>

</html>
