<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Удалить заметку</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>

<body class="container mt-5" style="max-width: 500px;">
    <div class="card border-danger shadow">
        <div class="card-body">
            <h5>⚠️ Удалить заметку «{{ note.title }}»?</h5>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                <a href="{% url 'note_list' %}" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-danger">Да, удалить</button>
            </form>
        </div>
    </div>
</body>

</html>
